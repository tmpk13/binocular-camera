[package]
name = "binocular-camera"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.16"
eframe = "0.36.1"
egui = "0.36.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
v4l = "0.14.0"
zune-jpeg = "0.5.15"

# The stereo matcher is the whole point of the app and is hopeless without
# optimization, so keep debug builds usable by optimizing dependencies and
# our own hot code even in the dev profile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
